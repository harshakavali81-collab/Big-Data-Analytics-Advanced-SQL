<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-label="Session event taxonomy"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1828"/><stop offset="1" stop-color="#162e43"/></linearGradient><linearGradient id="bar"><stop stop-color="#32d9bc"/><stop offset="1" stop-color="#61acff"/></linearGradient></defs><rect width="1200" height="670" fill="url(#bg)"/><path d="M0 110H1200M0 622H1200" stroke="#25465c"/><text x="50" y="58" fill="#effbff" font-family="Arial,sans-serif" font-size="37" font-weight="bold">Session event taxonomy</text><text x="52" y="92" fill="#9db8cc" font-size="18" font-family="Arial,sans-serif">Five ordered funnel stages; purchase revenue is recorded once</text><rect x="58" y="220" width="195" height="170" rx="16" fill="#3d75a2" stroke="#3e667b" stroke-width="2"/><text x="72" y="265" font-size="19" fill="#031e2b" font-weight="700" font-family="Arial,sans-serif">PAGE VIEW</text><text x="72" y="312" font-size="17" fill="#082c37" font-weight="400" font-family="Arial,sans-serif">all sessions</text><text x="72" y="351" font-size="17" fill="#082c37" font-weight="400" font-family="Arial,sans-serif">step 1</text><path d="M254 304L283 304" stroke="#67cfc8" stroke-width="4" fill="none"/><rect x="284" y="220" width="195" height="170" rx="16" fill="#33869f" stroke="#3e667b" stroke-width="2"/><text x="298" y="265" font-size="19" fill="#031e2b" font-weight="700" font-family="Arial,sans-serif">PRODUCT VIEW</text><text x="298" y="312" font-size="17" fill="#082c37" font-weight="400" font-family="Arial,sans-serif">all sessions</text><text x="298" y="351" font-size="17" fill="#082c37" font-weight="400" font-family="Arial,sans-serif">step 2</text><path d="M480 304L509 304" stroke="#67cfc8" stroke-width="4" fill="none"/><rect x="510" y="220" width="195" height="170" rx="16" fill="#319991" stroke="#3e667b" stroke-width="2"/><text x="524" y="265" font-size="19" fill="#031e2b" font-weight="700" font-family="Arial,sans-serif">ADD TO CART</text><text x="524" y="312" font-size="17" fill="#082c37" font-weight="400" font-family="Arial,sans-serif">some sessions</text><text x="524" y="351" font-size="17" fill="#082c37" font-weight="400" font-family="Arial,sans-serif">step 3</text><path d="M706 304L735 304" stroke="#67cfc8" stroke-width="4" fill="none"/><rect x="736" y="220" width="195" height="170" rx="16" fill="#29b98d" stroke="#3e667b" stroke-width="2"/><text x="750" y="265" font-size="19" fill="#031e2b" font-weight="700" font-family="Arial,sans-serif">CHECKOUT</text><text x="750" y="312" font-size="17" fill="#082c37" font-weight="400" font-family="Arial,sans-serif">fewer sessions</text><text x="750" y="351" font-size="17" fill="#082c37" font-weight="400" font-family="Arial,sans-serif">step 4</text><path d="M932 304L961 304" stroke="#67cfc8" stroke-width="4" fill="none"/><rect x="962" y="220" width="195" height="170" rx="16" fill="#3ccd9d" stroke="#3e667b" stroke-width="2"/><text x="976" y="265" font-size="19" fill="#031e2b" font-weight="700" font-family="Arial,sans-serif">PURCHASE</text><text x="976" y="312" font-size="17" fill="#082c37" font-weight="400" font-family="Arial,sans-serif">subset only</text><text x="976" y="351" font-size="17" fill="#082c37" font-weight="400" font-family="Arial,sans-serif">step 5</text><text x="73" y="487" font-size="24" fill="#d1edf6" font-weight="400" font-family="Arial,sans-serif">Single-session event ordering defines the conversion denominator.</text><text x="73" y="531" font-size="21" fill="#81eacb" font-weight="400" font-family="Arial,sans-serif">Revenue > 0 on purchase events only; no double counting.</text><text x="52" y="650" fill="#8bc5cf" font-family="Arial,sans-serif" font-size="17">CLICKSTREAM / DATA ENGINEERING • ORIGINAL SVG • SYNTHETIC DEMONSTRATION</text></svg>