 296" stroke="#67cfc8" stroke-width="4" fill="none"/><rect x="740" y="220" width="190" height="156" rx="16" fill="#19364a" stroke="#3e667b" stroke-width="2"/><text x="755" y="260" font-size="23" fill="#f2fdff" font-weight="700" font-family="Arial,sans-serif">SQL marts</text><text x="755" y="300" font-size="15" fill="#acd0df" font-weight="400" font-family="Arial,sans-serif">window / cohorts</text><path d="M930 296L962 296" stroke="#67cfc8" stroke-width="4" fill="none"/><rect x="965" y="220" width="190" height="156" rx="16" fill="#19364a" stroke="#3e667b" stroke-width="2"/><text x="980" y="260" font-size="23" fill="#f2fdff" font-weight="700" font-family="Arial,sans-serif">Dashboard</text><text x="980" y="300" font-size="15" fill="#acd0df" font-weight="400" font-family="Arial,sans-serif">retention / KPIs</text><rect x="66" y="440" width="1060" height="95" rx="16" fill="#102f3a" stroke="#3e667b" stroke-width="2"/><text x="90" y="477" font-size="25" fill="#80efcb" font-weight="400" font-family="Arial,sans-serif">Replay the same dataset from a seed. Inspect every metric calculation.</text><text x="91" y="509" font-size="18" fill="#b9d4de" font-weight="400" font-family="Arial,sans-serif">No actual visitors, customers, orders, revenue or production traffic.</text><text x="52" y="650" fill="#8bc5cf" font-family="Arial,sans-serif" font-size="17">CLICKSTREAM / DATA ENGINEERING • ORIGINAL SVG • SYNTHETIC DEMONSTRATION</text></svg>